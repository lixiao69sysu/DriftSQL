[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftsql-rl"
version = "0.1.0"
description = "Failure-driven Agentic RL for enterprise analytics under schema and metric drift."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<=2.12.3",
  "PyYAML>=6,<7",
  "sqlglot>=25,<30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
service = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.31,<1",
]

[tool.setuptools.packages.find]
include = ["driftsql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
