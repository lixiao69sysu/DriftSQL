name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,service]"
      - name: Portable core tests
        run: >-
          python -m pytest
          tests/test_metric_drift.py
          tests/test_mvp.py
          tests/test_drift_factory.py
          tests/test_reward_v2.py
          tests/test_schema_repair_plan.py
          tests/test_validated_submit_controller.py
      - name: Compile source and automation scripts
        run: python -m compileall -q driftsql scripts

  cli-service:
    runs-on: ubuntu-latest
    env:
      DRIFTSQL_PORTABLE_TOOL_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[dev,service]"
      - run: python -m pytest tests/test_cli_product.py tests/service
      - run: python -m driftsql.cli.app --help

  container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI/API runtime
        run: docker build -t driftsql-cli-contract .
      - name: Validate Compose contract
        run: docker compose config --quiet
